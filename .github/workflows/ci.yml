name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run benchmark
      - run: npm run atlas:benchmark
      - run: npm run atlas:verify -- atlas/right/right-grid-2x1.json
      - run: npm run atlas:release
      - run: npm run atlas:research
      - run: npm run atlas:v2
      - name: Confirm generated release artifacts are committed
        run: git diff --exit-code -- public/atlas-v2.json public/atlas-v2.csv public/atlas-v2.sha256 public/audit-v2.json public/work-queue-v2.json public/community-challenges-v2.json releases/2.0.0-canonical.json
      - run: npm run atlas:audit
      - run: npm run atlas:cross-verify
      - run: npm run atlas:archive-audit
      - run: npm run build:vercel
      - run: npm run build
      - run: npm run atlas:experiment -- --record iso-a60-r1p5
      - run: npm run atlas:submission -- atlas/submissions/template.json
      - run: npm run atlas:certificate -- proofs/right-grid-2x1.json atlas/right/right-grid-2x1.json
      - run: npm run atlas:beta
