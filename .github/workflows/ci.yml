name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark
      - run: npm run atlas:benchmark
      - run: npm run atlas:verify -- atlas/right/right-grid-2x1.json
      - run: npm run atlas:release
      - run: npm run atlas:research
      - run: npm run atlas:submission -- atlas/submissions/template.json
